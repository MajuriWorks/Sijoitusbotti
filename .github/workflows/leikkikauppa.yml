# Ajaa leikkikaupan joka arki-ilta GitHubin pilvessä ja päivittää raporttisivun.
name: Päivittäinen leikkikauppa

on:
  schedule:
    - cron: "45 17 * * 1-5"   # ilta: ma–pe 17:45 UTC = 19:45 Suomen talviaikaa (20:45 kesäaikaa)
    - cron: "15 6 * * 1-5"    # aamutarkistus: 06:15 UTC = 8:15 Suomen talviaikaa, ennen pörssin avausta klo 10
  workflow_dispatch:           # "Run workflow" -nappi käsin ajamiseen
    inputs:
      aamu:
        description: "Aamutarkistus (vain yön uutiset, ei uutta kauppapäivää)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: leikkikauppa
  cancel-in-progress: false

jobs:
  aja:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Asenna kirjastot
        run: pip install -r requirements.txt

      # Ilmaiset tekoälymallit uutisten tulkintaan (FinBERT + monikielinen).
      # Jos asennus epäonnistuu, botti käyttää avainsanoja eikä ajo keskeydy.
      - name: Asenna ilmaiset uutismallit
        continue-on-error: true
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install transformers sentencepiece protobuf

      - name: Asenna artikkelien lukutyökalut
        continue-on-error: true
        run: pip install trafilatura googlenewsdecoder

      - name: Mallien välimuisti
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-mallit-v1

      - name: Aja botit oikeilla kursseilla ja päivitä raporttisivu
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # valinnainen: tekoälytulkinta uutisille
        run: |
          if [ "${{ github.event.schedule }}" = "15 6 * * 1-5" ] || [ "${{ github.event.inputs.aamu }}" = "true" ]; then
            python paivittainen.py --julkaise --aamu
          else
            python paivittainen.py --julkaise
          fi

      - name: Tallenna salkkujen tila
        run: |
          git config user.name "sijoitusbotti"
          git config user.email "sijoitusbotti@users.noreply.github.com"
          git add tila arkisto docs
          git diff --cached --quiet || git commit -m "Leikkikauppa $(date +%F) $( [ '${{ github.event.schedule }}' = '15 6 * * 1-5' ] && echo aamu || echo ilta )"
          git pull --rebase
          git push

# ---------------- Valikoimat ----------------
# perus = v1-bottien alkuperäinen valikoima (ei muuteta lukitusjakson aikana)
# laaja = kaikki, mihin Nordnetissa voi sijoittaa ja mistä on kurssidataa
valikoimat:
  perus: [helsinki, pohjoismaat, etf]
  laaja: [helsinki, pohjoismaat, etf, etf_laaja, usa, usa_sp500, usa_nasdaq100]

# ---------------- Botit ----------------
# Kaikki botit käyttävät samaa tietopohjaa (kurssit, uutiset, tiedotteet, analyytikot,
# johdon kaupat, foorumit, maailman tapahtumat). Ero on aikajänteessä.
botit:
  lyhyt:
    kaytossa: true
    versio: v1            # Päivittäin: tuoreet uutiset + kurssiliike, pito päivistä ~3 viikkoon
  pitka:
    kaytossa: true
    versio: v1            # Kuukausittain: tasainen nousu + uutisvirta, pito kuukausista vuosiin
  yhdistelma:
    kaytossa: true
    versio: v1            # 60 % Pitkä + 40 % Lyhyt
  indeksi:
    kaytossa: true
    versio: v1            # Vertailukohta: maailmanindeksi ostettuna ja pidettynä
    etf: EUNL.DE
  # Samat v1-säännöt, mutta koko laaja valikoima (lisätty 20.11.2026)
  lyhyt_laaja:
    kaytossa: true
    versio: v1
    pohja: lyhyt
    nimi: Lyhyt laaja
    valikoima: laaja
  pitka_laaja:
    kaytossa: true
    versio: v1
    pohja: pitka
    nimi: Pitkä laaja
    valikoima: laaja
  yhdistelma_laaja:
    kaytossa: true
    versio: v1
    pohja: yhdistelma
    nimi: Yhdistelmä laaja
    valikoima: laaja
  # v2: teemat (maailman tapahtumat -> hyötyvät/kärsivät toimialat), perusvalikoima,
  # ajetaan leikkikaupan alusta tallennetuilla tiedoilla -> suoraan vertailukelpoinen v1:n kanssa
  lyhyt_v2:
    kaytossa: true
    versio: v2
    pohja: lyhyt
    nimi: Lyhyt teema
    aloita: alusta
  pitka_v2:
    kaytossa: true
    versio: v2
    pohja: pitka
    nimi: Pitkä teema
    aloita: alusta
  yhdistelma_v2:
    kaytossa: true
    versio: v2
    pohja: yhdistelma
    nimi: Yhdistelmä teema
    aloita: alusta
  # v3 (25.11.2026): v2 + korjaukset; ajetaan leikkikaupan alusta tallennetuilla tiedoilla
  lyhyt_v3:
    kaytossa: true
    versio: v3
    pohja: lyhyt
    nimi: Lyhyt
    aloita: alusta
  pitka_v3:
    kaytossa: true
    versio: v3
    pohja: pitka
    nimi: Pitkä
    aloita: alusta
  yhdistelma_v3:
    kaytossa: true
    versio: v3
    pohja: yhdistelma
    nimi: Yhdistelmä
    aloita: alusta
  # v4 (27.11.2026): v3 + Lyhyt ostaa kalliin osakkeen koko rahalla. Pitkä ja Yhdistelmä toimisivat
  # täsmälleen kuten v3 (Yhdistelmän Lyhyt-osalla on vain yksi osakepaikka), joten niitä ei ajeta.
  lyhyt_v4:
    kaytossa: true
    versio: v4
    pohja: lyhyt
    nimi: Lyhyt
    aloita: alusta
  # Uusi versio lisätään RINNALLE näin (vanha jatkaa ennallaan):
  # lyhyt_v2:
  #   kaytossa: true
  #   versio: v2
  #   pohja: lyhyt
  #   nimi: Lyhyt
  #   aloita: alusta     # ajetaan leikkikaupan alusta tallennetuilla tiedoilla -> vertailukelpoinen

# Lukitut versiot: koodi kansiossa versiot/<versio>/botti, ei muokata
versiot:
  v1:
    lukittu: "2026-11-20"
    muutos: "ensimmäinen lukittu versio (uutiset, tekstin luku, kriisit, 4 tarkastajaa, osingot)"
  v2:
    lukittu: "2026-11-20"
    muutos: "v1 + teemat: maailman tapahtumat nostavat hyötyviä ja laskevat kärsiviä toimialoja"
  v3:
    lukittu: "2026-11-25"
    muutos: "v2 + 'pienennä' ei puolita kauppaa vaan vaatii +2 % lisätuoton, kriisitaso vakavien uutisten osuutena, aikaraja vain liikkumattomille, hätämyynti vain kurssin vahvistamana (-3 % / 2 pv) eikä rauhoittavista tai jatkouutisista, vaihtolaskelma (heikoin omistus vaihdetaan selvästi parempaan, jos ero kattaa kulut), artikkelien tekstin sävy, väärät yhtiöosumat pois, pörssitiedotteet Nasdaqilta (rutiinit pois, osakeanti kielteinen), Lyhyt keskittää rahan yhteen osakkeeseen, jos kahden kaupan kulut olisivat liian suuret"

  v4:
    lukittu: "2026-11-27"
    muutos: "v3 + Lyhyt keskittää rahan myös, kun yksi osake maksaa enemmän kuin puolikas raha (Genmab jäi ostamatta)"

# ---------------- Uutiset, foorumit ja maailma ----------------
uutiset:
  kaytossa: true
  # Tekoälytulkinta otetaan käyttöön lisäämällä GitHubiin salaisuus ANTHROPIC_API_KEY.
  # Ilman sitä uutiset tulkitaan avainsanoilla.
  tekoaly_malli: claude-haiku-5-5
  max_yhtiohakuja: 300
  lue_artikkelit: true             # luetaan tärkeimpien uutisten teksti, ei vain otsikkoa
  max_luettavia_artikkeleita: 150  # per ajo
  lahteet:
    google_yhtiot: true      # yhtiökohtaiset uutiset ja pörssitiedotteet
    yahoo: true              # Yahoo Financen yhtiöuutiset
    analyytikot: true        # suositusmuutokset ja tavoitehinnat
    sisapiiri: true          # johdon liiketoimet
    maailma: true            # maailman tapahtumat ja markkinatunnelma
    suuret_mediat: true      # Reuters, Bloomberg, CNN, BBC, HS, Yle... (talous- ja pääuutiset)
    inderes_foorumi: true    # mistä yhtiöistä keskustellaan
    reddit: false            # Reddit estää GitHubin palvelimet (403) -> pois päältä
    nasdaq: true             # v3->: pörssitiedotteet suoraan Nasdaqilta (Helsinki, Tukholma, Kööpenhamina), koko teksti
    trump: false             # Trumpin päivitykset: pois päältä. Analyysi 11/2026 (14 527 päivitystä): yhtiömaininnat
                             # liikuttavat kurssia tavallista enemmän, mutta suunta ei ennustettavissa (~50 %) ja liike
                             # tapahtuu minuuteissa -> ei hyötyä iltabotille. Koodi jää (lisalahteet.py) mahdollista
                             # päivänsisäistä versiota varten.
  maailma_haut:
    - pörssi
    - osakemarkkinat
    - Suomen talous
    - stock market today
    - Federal Reserve interest rates
    - ECB interest rates
    - tariffs trade war
    - recession fears
    - oil price
    - geopolitical tensions markets
  # Markkinaa liikuttavat jättiyhtiöt: niiden kohut ja kriisit vaikuttavat koko markkinaan
  seuranta_yhtiot:
    - Nvidia
    - Apple
    - Microsoft
    - Alphabet Google
    - Amazon
    - Meta Platforms
    - Tesla
    - TSMC
    - ASML
    - Broadcom
  # Suuret mediat: päivän tuoreimmat jutut sivustoittain (Google News -haku)
  mediat:
    - reuters.com
    - bloomberg.com
    - apnews.com
    - cnn.com
    - bbc.com
    - wsj.com
    - ft.com
    - cnbc.com
    - nytimes.com
    - economist.com
    - hs.fi
    - yle.fi
    - kauppalehti.fi
    - talouselama.fi
    - arvopaperi.fi
    - is.fi
    - iltalehti.fi
    - stt.fi
    - di.se
    - e24.no
  # Suorat uutissyötteet (jos jokin lakkaa toimimasta, se näkyy raportin lähteiden tilassa)
  rss_syotteet:
    - https://feeds.bbci.co.uk/news/business/rss.xml
    - https://feeds.bbci.co.uk/news/world/rss.xml
    - https://www.cnbc.com/id/100003114/device/rss/rss.html
    - https://www.hs.fi/rss/talous.xml
    - https://feeds.kauppalehti.fi/rss/main
    - https://yle.fi/rss/uutiset/tuoreimmat
  reddit:
    - Osakkeet
    - stocks
    - investing
    - StockMarket
    - wallstreetbets


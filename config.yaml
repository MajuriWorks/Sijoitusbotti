# ============================================================
#  Sijoitusbotti – asetukset
#  Muokkaa tätä tiedostoa; koodiin ei tarvitse koskea.
# ============================================================

alkupaaoma: 1000          # euroa per botti (leikkiraha)

# ---------------- Kaupankäyntikulut ----------------
# Valitse käytössä oleva profiili. Historiatestissä voit verrata kaikkia:
#   python historiatesti.py --vertaa-kulut
# TARKISTA omat tasosi: Nordnet > Omat sivuni > Tilit > Välityspalkkioluokka.
# Pohjoismaat/Eurooppa/USA-luvut ovat arvioita – tarkista hinnastosta ennen oikeaa rahaa.
kuluprofiili: nordnet

kuluprofiilit:
  nordnet:                      # Nordnet perustaso (taso 4)
    helsinki:    {prosentti: 0.20, minimi: 9.0}
    pohjoismaat: {prosentti: 0.20, minimi: 9.0, valuutanvaihto_prosentti: 0.25}
    eurooppa:    {prosentti: 0.20, minimi: 15.0}
    usa:         {prosentti: 0.20, minimi: 9.0, valuutanvaihto_prosentti: 0.25}
  nordnet_osakesaastajat:       # Osakesäästäjien jäsen -> vähintään taso 3
    helsinki:    {prosentti: 0.15, minimi: 7.0}
    pohjoismaat: {prosentti: 0.15, minimi: 7.0, valuutanvaihto_prosentti: 0.25}
    eurooppa:    {prosentti: 0.20, minimi: 15.0}
    usa:         {prosentti: 0.15, minimi: 9.0, valuutanvaihto_prosentti: 0.25}
  nordea:                       # alle 800 € kaupoissa 1 % katto (Pohjoismaat + ETF:t)
    helsinki:    {prosentti: 0.20, minimi: 8.0, katto_alle: 800, katto_prosentti: 1.0}
    pohjoismaat: {prosentti: 0.20, minimi: 8.0, katto_alle: 800, katto_prosentti: 1.0, valuutanvaihto_prosentti: 0.50}
    eurooppa:    {prosentti: 0.20, minimi: 8.0, katto_alle: 800, katto_prosentti: 1.0}
    usa:         {prosentti: 0.20, minimi: 15.0, valuutanvaihto_prosentti: 0.50}
  ilman_kuluja:                 # vain vertailuun: kuinka paljon kulut maksavat
    helsinki:    {prosentti: 0.0, minimi: 0.0}
    pohjoismaat: {prosentti: 0.0, minimi: 0.0}
    eurooppa:    {prosentti: 0.0, minimi: 0.0}
    usa:         {prosentti: 0.0, minimi: 0.0}

# ---------------- Riskienhallinta ----------------
riskit:
  max_positiot: 2              # 1000 €:lla 2 positiota pitää kulut kohtuullisina
  max_kulu_prosentti: 2.5      # kauppaa ei tehdä, jos kulu ylittää tämän % kauppasummasta
  kateisvara_prosentti: 2      # pidetään käteisenä kulujen varalle
  stop_loss_prosentti: 15      # myy, jos kurssi laskee näin paljon huipustaan omistusaikana
  min_paivavaihto_eur: 200000  # vähemmän vaihdetut osakkeet jätetään pois (osto- ja myyntihinnan ero)

